[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kooperativa"
version = "0.1.0"
description = "Official Python SDK for the Kooperativa API: enrich and search professional profiles and companies, track hiring signals and job changes, and manage webhook monitors."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kooperativa", email = "support@kooperativa.io" }]
requires-python = ">=3.8"
keywords = ["kooperativa", "b2b", "enrichment", "data-enrichment", "sdk", "api-client"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://kooperativa.io"
Documentation = "https://docs.kooperativa.io"
Repository = "https://github.com/kooperativa-team/kooperativa-python"
Issues = "https://github.com/kooperativa-team/kooperativa-python/issues"

[tool.setuptools.packages.find]
where = ["src"]
